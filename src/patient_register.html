<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - HMS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f172a !important;
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            padding: 40px;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary-custom {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-secondary-custom:hover {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="./index.html">
                <img src="./hearth-beat-line-icon-health-medical-heartbeat-symbol-isolated-white-background-hospital-logo-vector-illustration-209787695-removebg-preview.png" style="height: 35px; margin-right: 10px;">
                <span class="fw-bold">HMS Receptionist Portal</span>
            </a>
            <div class="d-flex">
                <a href="./receptionist.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card-custom">
            <h2 class="fw-bold mb-2">Patient Intake Form</h2>
            <p class="text-muted mb-4">Register a new patient record in the system database.</p>

            <form id="patientRegisterForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="firstname" class="form-label">First Name</label>
                        <input type="text" id="firstname" class="form-control" required placeholder="e.g., Jane">
                    </div>
                    <div class="col-md-6">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input type="text" id="lastname" class="form-control" required placeholder="e.g., Doe">
                    </div>
                    <div class="col-md-6">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" id="dob" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-select" required>
                            <option value="" disabled selected>Select gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="bloodgroup" class="form-label">Blood Group</label>
                        <input type="text" id="bloodgroup" class="form-control" required placeholder="e.g., A+, O-">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" required placeholder="patient@example.com">
                    </div>
                    <div class="col-md-6">
                        <label for="phno" class="form-label">Phone Number</label>
                        <input type="tel" id="phno" class="form-control" required placeholder="10-digit mobile number">
                    </div>
                    <div class="col-md-6">
                        <label for="patient-username" class="form-label">Username</label>
                        <input type="text" id="patient-username" class="form-control" required placeholder="Create username" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label for="patient-password" class="form-label">Password</label>
                        <input type="password" id="patient-password" class="form-control" required placeholder="Create login password">
                    </div>
                    <div class="col-12">
                        <label for="address" class="form-label">Residential Address</label>
                        <textarea id="address" class="form-control" rows="3" required placeholder="Enter primary residential address details"></textarea>
                    </div>
                </div>

                <div class="row g-2 mt-4">
                    <div class="col-md-8">
                        <button type="submit" class="btn-submit w-100">Register Patient Profile</button>
                    </div>
                    <div class="col-md-4">
                        <a href="./receptionist.html" class="btn-secondary-custom w-100">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="./patient_register.js"></script>
</body>
</html>
