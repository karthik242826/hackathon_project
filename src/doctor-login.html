<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form-wrapper">
            <div class="login-header">
                <img src="./hearth-beat-line-icon-health-medical-heartbeat-symbol-isolated-white-background-hospital-logo-vector-illustration-209787695-removebg-preview.png" alt="Hospital Logo" class="login-logo">
                <h1>Doctor Login</h1>
            </div>
            <form id="doctorLoginForm" class="login-form">
                <div class="form-group">
                    <label for="doctor-username">Username</label>
                    <input type="text" id="doctor-username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="doctor-password">Password</label>
                    <input type="password" id="doctor-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-submit-btn">Login</button>
            </form>
            <div class="login-footer">
                <a href="./index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="error-modal">
        <div class="error-modal-content">
            <span class="error-close-btn">&times;</span>
            <h2>Login Failed</h2>
            <p id="errorMessage"></p>
            <button class="error-ok-btn">OK</button>
        </div>
    </div>

    <script src="./login.js"></script>
    <script>
        // Doctor credentials
        const validCredentials = {
            doctor: { username: 'doctor', password: 'doctor123' }
        };

        document.getElementById('doctorLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('doctor-username').value;
            const password = document.getElementById('doctor-password').value;
            
            if (username === validCredentials.doctor.username && password === validCredentials.doctor.password) {
                // Redirect to doctor dashboard
                window.location.href = './doctor.html';
            } else {
                showErrorModal('Invalid username or password. Please try again.');
            }
        });
    </script>
</body>
</html>
