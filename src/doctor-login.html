<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form-wrapper">
            <div class="login-header">
                <img src="./hearth-beat-line-icon-health-medical-heartbeat-symbol-isolated-white-background-hospital-logo-vector-illustration-209787695-removebg-preview.png" alt="Hospital Logo" class="login-logo">
                <h1>Doctor Login</h1>
            </div>
            <form id="doctorLoginForm" class="login-form">
                <div class="form-group">
                    <label for="doctor-username">Username</label>
                    <input type="text" id="doctor-username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="doctor-password">Password</label>
                    <input type="password" id="doctor-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-submit-btn">Login</button>
            </form>
            <div class="login-footer">
                <a href="./index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="error-modal">
        <div class="error-modal-content">
            <span class="error-close-btn">&times;</span>
            <h2>Login Failed</h2>
            <p id="errorMessage"></p>
            <button class="error-ok-btn">OK</button>
        </div>
    </div>

    <script src="./login.js"></script>
    <script>
        document.getElementById('doctorLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('doctor-username').value.trim();
            const password = document.getElementById('doctor-password').value;
            
            try {
                const response = await fetch('/api/admin/verify-doctor-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    sessionStorage.setItem('hms_doctor_auth', 'true');
                    sessionStorage.setItem('hms_doctor_id', data.doctor.D_ID);
                    sessionStorage.setItem('hms_doctor_name', `Dr. ${data.doctor.DOCTOR_FIRSTNAME} ${data.doctor.DOCTOR_LASTNAME}`);
                    
                    window.location.href = './doctor.html';
                } else {
                    showErrorModal(data.error || 'Invalid username or password. Please try again.');
                }
            } catch (err) {
                console.error('Login check failed:', err);
                showErrorModal('Network error. Failed to reach the server.');
            }
        });
    </script>
</body>
</html>
