<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — HMS Patient Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #090d16 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #f1f5f9;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: absolute;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header i {
            font-size: 44px;
            color: #10b981;
            margin-bottom: 12px;
            display: inline-block;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            color: white;
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: #34d399; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card" id="formCard">
            <div class="header">
                <i class="bi bi-shield-check"></i>
                <h1>Reset Password</h1>
                <p>Create a secure new password for your patient account</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>
                    <div id="passwordError" class="error-msg"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
            </form>

            <a href="./patient-login.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const username = urlParams.get('username');

        // Check if token and username are present
        if (!token || !username) {
            const card = document.getElementById('formCard');
            card.innerHTML = `
                <div class="header" style="margin-bottom: 0;">
                    <i class="bi bi-exclamation-triangle-fill" style="color: #f87171;"></i>
                    <h1 style="color: #f87171;">Invalid Link</h1>
                    <p style="margin-top: 10px;">This password reset link is invalid, malformed, or has expired.</p>
                    <a href="./patient-login.html" class="back-link" style="margin-top: 24px;">
                        <i class="bi bi-arrow-left"></i> Go to Patient Login
                    </a>
                </div>
            `;
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errDiv = document.getElementById('passwordError');

            if (newPassword !== confirmPassword) {
                errDiv.textContent = "Passwords do not match.";
                errDiv.style.display = "block";
                return;
            }

            errDiv.style.display = "none";
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "Updating...";

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, otp: token, newPassword })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert('Success: Password reset successfully! You can now log in with your new password.');
                    window.location.href = './patient-login.html';
                } else {
                    alert(data.error || 'Failed to reset password. The link may have expired.');
                    btn.disabled = false;
                    btn.textContent = "Update Password";
                }
            } catch (err) {
                alert('Network error. Failed to reach the server.');
                btn.disabled = false;
                btn.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
