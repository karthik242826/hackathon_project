<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment - HMS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f172a !important;
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            padding: 40px;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary-custom {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-secondary-custom:hover {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="./index.html">
                <img src="./hearth-beat-line-icon-health-medical-heartbeat-symbol-isolated-white-background-hospital-logo-vector-illustration-209787695-removebg-preview.png" style="height: 35px; margin-right: 10px;">
                <span class="fw-bold">HMS Receptionist Portal</span>
            </a>
            <div class="d-flex">
                <a href="./receptionist.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card-custom">
            <h2 class="fw-bold mb-2">Schedule Appointment</h2>
            <p class="text-muted mb-4">Book a new appointment slot for registered patients.</p>

            <form id="bookingForm">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="patient-select" class="form-label">Select Patient</label>
                        <select id="patient-select" class="form-select" required>
                            <option value="" disabled selected>Loading patients...</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="doctor-select" class="form-label">Select Treating Physician</label>
                        <select id="doctor-select" class="form-select" required>
                            <option value="" disabled selected>Loading doctors...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="appointment-date" class="form-label">Appointment Date</label>
                        <input type="date" id="appointment-date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="appointment-time" class="form-label">Time Slot</label>
                        <select id="appointment-time" class="form-select" required>
                            <option value="" disabled selected>Select time slot</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="09:30 AM">09:30 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="10:30 AM">10:30 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="11:30 AM">11:30 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="12:30 PM">12:30 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="02:30 PM">02:30 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="03:30 PM">03:30 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="04:30 PM">04:30 PM</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="visit-type" class="form-label">Visit Type</label>
                        <select id="visit-type" class="form-select" required>
                            <option value="NEW">New Visit</option>
                            <option value="FOLLOW-UP">Follow-Up Visit</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2 mt-4">
                    <div class="col-md-8">
                        <button type="submit" class="btn-submit w-100">Confirm Appointment Booking</button>
                    </div>
                    <div class="col-md-4">
                        <a href="./receptionist.html" class="btn-secondary-custom w-100">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="./booking.js"></script>
</body>
</html>
